<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Racing Ride 3D Extreme</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:#87ceeb;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  top:12px;
  left:12px;
  z-index:20;
  color:white;
  background:rgba(0,0,0,.7);
  padding:12px 16px;
  border-radius:14px;
  line-height:1.6;
  font-weight:bold;
}

#controls{
  position:fixed;
  bottom:18px;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 18px;
  z-index:30;
}

button{
  width:62px;
  height:62px;
  border:0;
  border-radius:16px;
  color:white;
  background:rgba(0,0,0,.75);
  font-size:24px;
  margin:3px;
}

button:active{
  transform:scale(.9);
}

#gas{
  background:#159447;
}

#brake{
  background:#d62828;
}

#gameOver{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.82);
  color:white;
  text-align:center;
  padding-top:30vh;
}

#gameOver h1{
  font-size:42px;
}

#restart{
  width:180px;
  margin-top:20px;
  background:#159447;
  font-size:18px;
}
</style>
</head>

<body>

<div id="hud">
🏁 Jarak: <span id="distance">0</span> m<br>
⭐ Skor: <span id="score">0</span><br>
🚗 Kecepatan: <span id="speed">0</span><br>
⛰️ Medan: <span id="terrain">Jalan</span>
</div>

<div id="controls">
  <div>
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>

  <div>
    <button id="brake">▼</button>
    <button id="gas">▲</button>
  </div>
</div>

<div id="gameOver">
  <h1>GAME OVER</h1>
  <p>Skor: <span id="finalScore">0</span></p>
  <p>Jarak: <span id="finalDistance">0</span> m</p>
  <button id="restart">MAIN LAGI</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

// =====================================
// SCENE
// =====================================

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x87ceeb);

const camera =
  new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    0.1,
    1000
  );

const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
  renderer.domElement
);


// =====================================
// CAHAYA
// =====================================

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x555555,
    1.5
  )
);

const sun =
  new THREE.DirectionalLight(
    0xffffff,
    1.5
  );

sun.position.set(
  20,
  30,
  10
);

sun.castShadow = true;

scene.add(sun);


// =====================================
// JALAN
// =====================================

const road =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      14,
      700
    ),
    new THREE.MeshStandardMaterial({
      color:0x333333
    })
  );

road.rotation.x =
  -Math.PI / 2;

road.position.z =
  -300;

scene.add(road);


// =====================================
// RUMPUT
// =====================================

const grass =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      120,
      700
    ),
    new THREE.MeshStandardMaterial({
      color:0x319b35
    })
  );

grass.rotation.x =
  -Math.PI / 2;

grass.position.y =
  -0.04;

grass.position.z =
  -300;

scene.add(grass);


// =====================================
// GARIS JALAN
// =====================================

const roadLines = [];

for(
  let z=5;
  z>-700;
  z-=8
){

  const line =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .25,
        .05,
        4
      ),
      new THREE.MeshStandardMaterial({
        color:0xffffff
      })
    );

  line.position.set(
    0,
    .04,
    z
  );

  scene.add(line);

  roadLines.push(line);
}


// =====================================
// MOBIL
// =====================================

function createCar(color){

  const car =
    new THREE.Group();


  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.6,
        .55,
        2.8
      ),
      new THREE.MeshStandardMaterial({
        color:color
      })
    );

  body.position.y=.45;

  body.castShadow=true;

  car.add(body);


  const cabin =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.15,
        .5,
        1.3
      ),
      new THREE.MeshStandardMaterial({
        color:0x151515
      })
    );

  cabin.position.set(
    0,
    .87,
    0
  );

  car.add(cabin);


  const wheelGeo =
    new THREE.CylinderGeometry(
      .28,
      .28,
      .18,
      16
    );

  const wheelMat =
    new THREE.MeshStandardMaterial({
      color:0x111111
    });


  const wheels=[
    [-.85,.3,.9],
    [.85,.3,.9],
    [-.85,.3,-.9],
    [.85,.3,-.9]
  ];


  wheels.forEach(p=>{

    const wheel =
      new THREE.Mesh(
        wheelGeo,
        wheelMat
      );

    wheel.rotation.z =
      Math.PI/2;

    wheel.position.set(
      p[0],
      p[1],
      p[2]
    );

    car.add(wheel);

  });


  return car;
}


// =====================================
// PLAYER
// =====================================

const player =
  createCar(0x0066ff);

player.position.set(
  0,
  0,
  5
);

scene.add(player);


// =====================================
// MUSUH
// =====================================

const enemies=[];

function spawnEnemy(z){

  const lanes=[
    -4,
    0,
    4
  ];

  const enemy =
    createCar(0xe63946);

  enemy.position.set(
    lanes[
      Math.floor(
        Math.random()*3
      )
    ],
    0,
    z
  );

  scene.add(enemy);

  enemies.push(enemy);
}


for(
  let i=0;
  i<6;
  i++
){

  spawnEnemy(
    -70 - i*70
  );

}


// =====================================
// CONE RINTANGAN
// =====================================

const cones=[];

function createCone(z){

  const cone =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        .35,
        .9,
        12
      ),
      new THREE.MeshStandardMaterial({
        color:0xff6600
      })
    );

  const lanes=[
    -4,
    0,
    4
  ];

  cone.position.set(
    lanes[
      Math.floor(
        Math.random()*3
      )
    ],
    .45,
    z
  );

  scene.add(cone);

  cones.push(cone);
}


for(
  let i=0;
  i<10;
  i++
){

  createCone(
    -40 - i*55
  );

}


// =====================================
// KOIN
// =====================================

const coins=[];

function createCoin(z){

  const coin =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .35,
        .35,
        .12,
        20
      ),
      new THREE.MeshStandardMaterial({
        color:0xffd700,
        metalness:.7
      })
    );

  coin.rotation.z =
    Math.PI/2;

  const lanes=[
    -4,
    0,
    4
  ];

  coin.position.set(
    lanes[
      Math.floor(
        Math.random()*3
      )
    ],
    .9,
    z
  );

  scene.add(coin);

  coins.push(coin);
}


for(
  let i=0;
  i<15;
  i++
){

  createCoin(
    -30 - i*45
  );

}


// =====================================
// BUKIT / TANJAKAN
// =====================================

const hills=[];

function createHill(z){

  const hill =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        12,
        16,
        8,
        32,
        1,
        false
      ),
      new THREE.MeshStandardMaterial({
        color:0x277d2d
      })
    );

  hill.position.set(
    Math.random()>0.5
      ? -18
      : 18,
    2,
    z
  );

  scene.add(hill);

  hills.push(hill);
}

for(
  let i=0;
  i<10;
  i++
){

  createHill(
    -60-i*70
  );

}


// =====================================
// VARIABEL
// =====================================

let speed=.45;

let distance=0;

let score=0;

let gameOver=false;

const keys={};


// =====================================
// KEYBOARD
// =====================================

document.addEventListener(
  "keydown",
  e=>{
    keys[
      e.key.toLowerCase()
    ]=true;
  }
);

document.addEventListener(
  "keyup",
  e=>{
    keys[
      e.key.toLowerCase()
    ]=false;
  }
);


// =====================================
// KONTROL HP
// =====================================

function hold(
  id,
  key
){

  const button =
    document.getElementById(id);


  button.addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();
      keys[key]=true;
    }
  );


  button.addEventListener(
    "touchend",
    e=>{
      e.preventDefault();
      keys[key]=false;
    }
  );


  button.addEventListener(
    "mousedown",
    ()=>{
      keys[key]=true;
    }
  );


  button.addEventListener(
    "mouseup",
    ()=>{
      keys[key]=false;
    }
  );

}


hold("left","a");
hold("right","d");
hold("gas","w");
hold("brake","s");


// =====================================
// MEDAN JALAN
// =====================================

function getTerrain(){

  const d =
    Math.floor(distance);

  if(
    d % 300 < 80
  ){

    return "⛰️ TANJAKAN";

  }

  if(
    d % 300 >= 80 &&
    d % 300 < 150
  ){

    return "⬇️ TURUNAN";

  }

  if(
    d % 200 >= 150 &&
    d % 200 < 190
  ){

    return "↩️ BELOKAN";

  }

  return "🛣️ Jalan";

}


// =====================================
// UPDATE
// =====================================

function update(){

  if(gameOver)
    return;


  // GAS

  if(keys["w"]){

    speed += .012;

  }else{

    speed -= .004;

  }


  speed =
    Math.max(
      .25,
      Math.min(
        1.5,
        speed
      )
    );


  // REM

  if(keys["s"]){

    speed -= .025;

    speed =
      Math.max(
        .1,
        speed
      );

  }


  // BELok

  if(keys["a"]){

    player.position.x -=
      .17;

    player.rotation.y =
      .12;

  }else if(keys["d"]){

    player.position.x +=
      .17;

    player.rotation.y =
      -.12;

  }else{

    player.rotation.y =
      0;

  }


  player.position.x =
    Math.max(
      -5.3,
      Math.min(
        5.3,
        player.position.x
      )
    );


  // MEDAN

  const terrain =
    getTerrain();

  document.getElementById(
    "terrain"
  ).textContent =
    terrain;


  // TANJAKAN

  if(
    terrain.includes(
      "TANJAKAN"
    )
  ){

    speed -= .004;

    player.rotation.x =
      -0.06;

  }


  // TURUNAN

  else if(
    terrain.includes(
      "TURUNAN"
    )
  ){

    speed += .003;

    player.rotation.x =
      0.06;

  }

  else{

    player.rotation.x=0;

  }


  // =================================
  // GARIS JALAN BERGERAK
  // =================================

  roadLines.forEach(
    line=>{

      line.position.z +=
        speed;

      if(
        line.position.z >
        player.position.z+10
      ){

        line.position.z -=
          700;

      }

    }
  );


  // =================================
  // MUSUH
  // =================================

  enemies.forEach(
    enemy=>{

      enemy.position.z +=
        speed * .85;


      if(
        enemy.position.z >
        player.position.z+15
      ){

        enemy.position.z =
          player.position.z -
          100 -
          Math.random()*100;

        enemy.position.x =
          [-4,0,4][
            Math.floor(
              Math.random()*3
            )
          ];

        score+=10;

      }


      const dx =
        Math.abs(
          player.position.x -
          enemy.position.x
        );

      const dz =
        Math.abs(
          player.position.z -
          enemy.position.z
        );


      if(
        dx<1.35 &&
        dz<2.2
      ){

        endGame();

      }

    }
  );


  // =================================
  // CONE
  // =================================

  cones.forEach(
    cone=>{

      cone.position.z +=
        speed;

      cone.rotation.y +=
        .05;


      if(
        cone.position.z >
        player.position.z+12
      ){

        cone.position.z =
          player.position.z -
          130;

        cone.position.x =
          [-4,0,4][
            Math.floor(
              Math.random()*3
            )
          ];

      }


      const dx =
        Math.abs(
          player.position.x -
          cone.position.x
        );

      const dz =
        Math.abs(
          player.position.z -
          cone.position.z
        );


      if(
        dx<1.1 &&
        dz<1.5
      ){

        speed -= .12;

        cone.position.z =
          player.position.z -
          130;

      }

    }
  );


  // =================================
  // KOIN
  // =================================

  coins.forEach(
    coin=>{

      coin.position.z +=
        speed;

      coin.rotation.y +=
        .08;


      if(
        coin.position.z >
        player.position.z+10
      ){

        coin.position.z =
          player.position.z -
          130;

        coin.position.x =
          [-4,0,4][
            Math.floor(
              Math.random()*3
            )
          ];

      }


      const dx =
        Math.abs(
          player.position.x -
          coin.position.x
        );

      const dz =
        Math.abs(
          player.position.z -
          coin.position.z
        );


      if(
        dx<1.2 &&
        dz<1.5
      ){

        score+=25;

        coin.position.z =
          player.position.z -
          130;

      }

    }
  );


  // =================================
  // JARAK
  // =================================

  distance +=
    speed*.12;


  document.getElementById(
    "distance"
  ).textContent =
    Math.floor(distance);


  document.getElementById(
    "score"
  ).textContent =
    score;


  document.getElementById(
    "speed"
  ).textContent =
    Math.floor(
      speed*100
    );


  // =================================
  // KAMERA
  // =================================

  camera.position.x =
    player.position.x;

  camera.position.y =
    5.2;

  camera.position.z =
    player.position.z+10;


  camera.lookAt(
    player.position.x,
    .5,
    player.position.z-20
  );

}


// =====================================
// GAME OVER
// =====================================

function endGame(){

  gameOver=true;

  document.getElementById(
    "finalScore"
  ).textContent =
    score;

  document.getElementById(
    "finalDistance"
  ).textContent =
    Math.floor(distance);

  document.getElementById(
    "gameOver"
  ).style.display =
    "block";
}


// =====================================
// RESTART
// =====================================

document.getElementById(
  "restart"
).onclick=()=>{

  location.reload();

};


// =====================================
// GAME LOOP
// =====================================

function animate(){

  requestAnimationFrame(
    animate
  );

  update();

  renderer.render(
    scene,
    camera
  );

}

animate();


// =====================================
// RESIZE
// =====================================

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

</script>

</body>
</html>
